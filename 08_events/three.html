    <button id="stop">stop</button>

<script>

// we are discussing the method
// setInterval it is useful when the task is doing multiple time 
// it repeat the process 
// we can use a third parameter inside the setInterval
// if when you stop the method you can use the clearInterval method
    const repeat = function(str){
        console.log(str , Date.now());
    }
     const stop = setInterval(repeat, 1000 , "hi")

     // it completely stop the setInterval method 
     clearInterval(stop)
</script>
